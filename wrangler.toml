# سيرفر ADWMX الجديد : Worker + قاعدة D1 جديدة فاضية — مفيش أي مستخدمين قدام.
name = "adwmx2"
main = "worker.js"
compatibility_date = "2026-11-05"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "adwmx2"
# من غير database_id: wrangler بينشئ القاعدة adwmx2 تلقائياً أول نشر (Workers Builds أو wrangler deploy).
# لو فضّلت تنشئها بإيدك من لوحة Cloudflare: أضف هنا سطر  database_id = "الـ-ID-بتاعها"

[vars]
# رقم المطور: له لوحة الإدارة وحذف الحسابات وعلامة التوثيق. (setup.mjs --dev 01xxxxxxxxx بيكتبه)
DEVELOPER_PHONE = ""
# "true" يعرض سبب الخطأ في التطبيق. غيّره لـ "false" بعد ما كل شي يشتغل.
DEBUG = "true"
